name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify npm version
        run: |
          npm_version=$(npm --version)
          echo "Using npm $npm_version"
          if [[ ! "$npm_version" =~ ^11\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected npm >=11 <12." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ai-service/.python-version

      - name: Install root npm dependencies
        run: npm ci

      - name: Install frontend npm dependencies
        run: npm --prefix frontend ci

      - name: Install Python development dependencies
        run: |
          python -m venv ai-service/.venv
          ai-service/.venv/bin/python -m pip install -r ai-service/requirements-dev.txt

      - name: Provision Maven packaging dependencies
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check package

      - name: Validate project
        run: npm run validate
